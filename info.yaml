# Tiny Tapeout project information
project:
  title:       "Reprogrammable Custom RISC-V Processor"
  author:      "YOUR NAME HERE"                                # EDIT
  discord:     "your_discord_username"                         # EDIT (optional)
  description: "A reprogrammable 5-stage pipelined custom RISC-V processor: no program is hardened into the chip; instruction memory, data memory and registers are loaded over I2C after fabrication. Forwarding, load-use stalling, branch prediction, and x86-style ALU flags (ZF CF SF OF PF AF) in the CSR."
  language:    "Verilog"
  clock_hz:    10000000        # matches CLOCK_PERIOD=100 in config.json (100ns = 10MHz)

  # TILE SIZE: 4x4 with a 64-word IMEM and 16-word DMEM (IM_AW / DM_AW in
  # custom_risc_v_core.v). A Yosys + sky130 area estimate, calibrated on an
  # earlier 4x4 run (54%), puts this at ~81.5%. To fit, I2C readback shares
  # the CPU read ports and the register file has no reset; config.json uses
  # density 85 without cell padding. (256 words would need ~40 tiles.)
  tiles: "4x4"   # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_".
  top_module: "tt_um_custom_risc_v_core"

  # Every file the design uses -- a missing entry here causes an "unknown
  # module" error during synthesis, the same class of failure as the
  # earlier Icarus "unknown module" errors seen in local checks.
  source_files:
    - "tt_um_custom_risc_v_core.v"
    - "custom_risc_v_core.v"
    - "i2c_slave_mmio.v"
    - "mmio_decoder.v"
    - "data_memory.v"
    - "instruction_memory.v"
    - "reg_file.v"
    - "ALU.v"
    - "BHT.v"
    - "BTB.v"
    - "branching_unit.v"
    - "comparator.v"
    - "control_unit.v"
    - "EX_MEM_register.v"
    - "Flushing_unit.v"
    - "forward_rt.v"
    - "Forwarding_unit.v"
    - "Forward_rs.v"
    - "ID_EX_register.v"
    - "IF_ID_register.v"
    - "M_WB_register.v"
    - "mux_1.v"
    - "mux_1_execution.v"
    - "mux_2.v"
    - "mux_2_execution.v"
    - "mux_3_execution.v"
    - "Pc.v"
    - "PHT.v"
    - "Sign_extender.v"
    - "stalling_unit.v"
    - "Write_back_mux.v"
    - "Xor_result.v"

  # The pinout of your project. Must match tt_um_custom_risc_v_core.v exactly.
pinout:
  ui[0]: "scl"
  ui[1]: ""
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""
  uo[0]: "led"
  uo[1]: ""
  uo[2]: ""
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""
  uio[0]: "sda"
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
